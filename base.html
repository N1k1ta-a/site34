<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}RAVE{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('about') }}">О клубе</a>
        <a href="{{ url_for('contacts') }}">Контакты</a>
        <a href="{{ url_for('item_list') }}">Зоны (БД)</a>
        <a href="{{ url_for('category_list') }}">Категории</a>
        
        <div class="auth-nav">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('profile') }}" class="user-link">👤 {{ current_user.username }}</a>
                {% if current_user.is_admin() %}
                    <a href="{{ url_for('user_list') }}" class="btn btn-small">Админка</a>
                {% endif %}
                <a href="{{ url_for('logout') }}" class="btn btn-small btn-danger">Выйти</a>
            {% else %}
                <a href="{{ url_for('login') }}">Вход</a>
                <a href="{{ url_for('register') }}">Регистрация</a>
            {% endif %}
        </div>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>© 2026 {{ site_name }}. 600 Гц и ни граммом меньше.</p>
</footer>

</body>
</html>
